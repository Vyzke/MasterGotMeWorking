<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- tiling pattern for page headers: dots, a tiny cap, a book and a sparkle -->
  <g fill="#6247d8">
    <circle cx="10" cy="10" r="1.6" fill-opacity=".22"/>
    <circle cx="90" cy="10" r="1.6" fill-opacity=".22"/>
    <circle cx="50" cy="50" r="1.6" fill-opacity=".22"/>
    <circle cx="130" cy="50" r="1.6" fill-opacity=".22"/>
    <circle cx="10" cy="90" r="1.6" fill-opacity=".22"/>
    <circle cx="90" cy="90" r="1.6" fill-opacity=".22"/>
    <circle cx="50" cy="130" r="1.6" fill-opacity=".22"/>
    <circle cx="130" cy="130" r="1.6" fill-opacity=".22"/>
  </g>
  <g fill="none" stroke="#6247d8" stroke-opacity=".2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- cap -->
    <path d="M118 78 l14 -7 14 7 -14 7z"/>
    <path d="M124 82 v6 c0 3 16 3 16 0 v-6"/>
    <!-- book -->
    <path d="M22 122 h9 a4 4 0 0 1 4 4 v14 a3 3 0 0 0 -3 -3 h-10z M48 122 h-9 a4 4 0 0 0 -4 4 v14 a3 3 0 0 1 3 -3 h10z"/>
  </g>
  <path d="M70 18 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#8a6cf2" fill-opacity=".3"/>
</svg>
